services:
  hub:
    build: ./hub
    # Ausdrücklich benannt, nicht dem Compose-Standard überlassen: Der
    # gebaute Stand kommt von deploy/rebuild-hub.sh, das genau unter
    # diesem Namen baut. Ohne die Zeile hiesse das Abbild nach dem Stack
    # ("<stack>-hub"), und beim kleinsten Umbenennen des Stacks rollte
    # Portainer wortlos wieder den alten Stand aus.
    image: homepilot-hub
    container_name: homepilot-hub
    restart: unless-stopped

    # Das eigene Netz des Rechners statt eines Docker-Netzes: Der Hub muss
    # Hue-Bridge, CCU und MQTT-Broker direkt erreichen, und die CCU muss
    # ihre Events an den Hub zurückschicken können. Mit einem Bridge-Netz
    # käme die CCU nicht an den Callback-Port heran.
    network_mode: host

    volumes:
      # config.yaml aus hub/ hereinreichen, nur lesend.
      # Der ganze Ordner, nicht nur die Datei: Der Hub schreibt hier auch
      # homepilot-data.json mit den in der App angelegten Benutzern.
      - ./hub:/config

    environment:
      # Keys stehen nicht in der config.yaml, sondern kommen aus .env
      # (siehe deploy/README.md).
      - HOMEPILOT_TOKEN=${HOMEPILOT_TOKEN}
      - UPDATE_SECRET=${UPDATE_SECRET:-}
      - TOKEN_STEFAN=${TOKEN_STEFAN:-}
      - TOKEN_PARTNERIN=${TOKEN_PARTNERIN:-}
      - TOKEN_GAST=${TOKEN_GAST:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - OVERKIZ_TOKEN=${OVERKIZ_TOKEN:-}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - UNIFI_USER=${UNIFI_USER:-}
      - UNIFI_PASSWORD=${UNIFI_PASSWORD:-}
      - HUE_APP_KEY=${HUE_APP_KEY:-}
      - NUKI_TOKEN=${NUKI_TOKEN:-}
      - VZUG_USER=${VZUG_USER:-}
      - VZUG_PASSWORD=${VZUG_PASSWORD:-}
      - TZ=Europe/Zurich

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Live-Bild der Kameras (RTSP → Low-Latency-HLS, ohne Neucodierung).
  # Ohne diesen Dienst fällt der Hub auf ffmpeg zurück.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: homepilot-mediamtx
    restart: unless-stopped
    network_mode: host
    # Konfiguration über Umgebungsvariablen – erklärt in
    # docker-compose.portainer.yml, dort steht dieselbe Liste.
    environment:
      - MTX_API=true
      - MTX_APIADDRESS=127.0.0.1:9997
      # Interner Publish-Port: ffmpeg (im Container) reicht das Video hier
      # ohne Tonspuren an mediamtx weiter – nur auf 127.0.0.1.
      - MTX_RTSP=true
      - MTX_RTSPADDRESS=127.0.0.1:8554
      - MTX_RTMP=false
      - MTX_SRT=false
      - MTX_WEBRTC=false
      - MTX_HLS=true
      - MTX_HLSADDRESS=127.0.0.1:8888
      - MTX_HLSVARIANT=lowLatency
      - MTX_HLSSEGMENTCOUNT=7
      - MTX_HLSSEGMENTDURATION=1s
      - MTX_HLSPARTDURATION=200ms
      - MTX_HLSALLOWORIGIN=*
      - MTX_HLSALWAYSREMUX=false

  # Matter-Controller – nur nötig, wenn die matter-Integration aktiv ist.
  # Hält die Fabric (Schlüssel, Zertifikate) in einem eigenen Volume; der
  # Hub spricht ihn über ws://127.0.0.1:5580/ws an. host-Netz und Bluetooth
  # (dbus) braucht er, um neue Geräte im WLAN/Thread zu koppeln.
