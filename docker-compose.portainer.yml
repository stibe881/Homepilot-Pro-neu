# HomePilot-Stack für Portainer (Deployment aus dem Git-Repository).
# Anleitung: deploy/portainer.md
#
# Unterschied zur docker-compose.yml im Wurzelverzeichnis: Die Konfiguration
# kommt aus /opt/homepilot auf dem Docker-Host statt aus dem Repo-Ordner –
# bei einem Repository-Stack verwaltet Portainer den Klon selbst, und die
# persönliche config.yaml gehört nicht ins Repo.

services:
  hub:
    build: ./hub
    # Ausdrücklich benannt, nicht dem Compose-Standard überlassen: Der
    # gebaute Stand kommt von deploy/rebuild-hub.sh, das genau unter
    # diesem Namen baut. Ohne die Zeile hiesse das Abbild nach dem Stack
    # ("<stack>-hub"), und beim kleinsten Umbenennen des Stacks rollte
    # Portainer wortlos wieder den alten Stand aus.
    image: homepilot-hub
    # Dieses Abbild entsteht auf dem Docker-Host (deploy/rebuild-hub.sh)
    # und liegt in keiner Registry. Ohne diese Zeile versucht Portainer
    # es vor jedem Ausrollen zu ziehen, scheitert mit «pull access denied
    # for homepilot-hub» - und bricht dann den ganzen Stack ab, obwohl
    # das frische Abbild fertig danebenliegt.
    #
    # 'never' und nicht 'build': Gebaut wird bereits im Skript, mit
    # --no-cache und mit der Commit-Kennung im Abbild. Portainer soll es
    # benutzen, nicht ein zweites Mal bauen.
    pull_policy: never
    container_name: homepilot-hub
    restart: unless-stopped

    # Deckel für das Protokoll dieses Containers. Docker schreibt die
    # Ausgabe sonst ohne Obergrenze in eine Datei, die wächst, solange der
    # Container läuft - bei einem gesprächigen Dienst um Gigabytes im
    # Jahr, und kein «prune» fasst sie an. Drei Dateien à 10 MB heisst:
    # höchstens 30 MB, und die letzten Tage bleiben lesbar.
    #
    # Bewusst hier und nicht in der daemon.json: Das gilt beim nächsten
    # Ausrollen des Stacks, ohne den Docker-Dienst neu zu starten - der
    # würde jeden anderen Container auf dem Rechner mitreissen.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    # Das eigene Netz des Rechners statt eines Docker-Netzes: Der Hub muss
    # Hue-Bridge, CCU und MQTT-Broker direkt erreichen, und die CCU schickt
    # ihre Events aktiv an den Hub zurück.
    network_mode: host

    volumes:
      # Auf dem Host anlegen: /opt/homepilot mit config.yaml darin.
      # Der Hub schreibt hierhin auch homepilot-data.json (App-Benutzer
      # und -Abläufe) – der Ordner gehört ins Backup.
      - /opt/homepilot:/config

    environment:
      # Werte kommen aus den "Environment variables" des Portainer-Stacks.
      #
      # WICHTIG: Eine Variable dort einzutragen genügt nicht. Portainer
      # setzt sie beim Deployen nur in *diese* Datei ein – in den Container
      # kommt sie erst durch eine Zeile in dieser Liste. Wer eine neue
      # Variable in der config.yaml benutzt, trägt sie also auch hier ein.
      - HOMEPILOT_TOKEN=${HOMEPILOT_TOKEN}
      - UPDATE_SECRET=${UPDATE_SECRET:-}
      - TOKEN_STEFAN=${TOKEN_STEFAN:-}
      - TOKEN_PARTNERIN=${TOKEN_PARTNERIN:-}
      - TOKEN_GAST=${TOKEN_GAST:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      # Für die Anmeldung mit E-Mail und Passwort (siehe docs/anmeldung.md).
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - OVERKIZ_TOKEN=${OVERKIZ_TOKEN:-}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - UNIFI_USER=${UNIFI_USER:-}
      - UNIFI_PASSWORD=${UNIFI_PASSWORD:-}
      - HUE_APP_KEY=${HUE_APP_KEY:-}
      - HUE_SYNC_TOKEN=${HUE_SYNC_TOKEN:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
      - SPOTIFY_SP_DC=${SPOTIFY_SP_DC:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      - ROBOROCK_EMAIL=${ROBOROCK_EMAIL:-}
      - ROBOROCK_PASSWORD=${ROBOROCK_PASSWORD:-}
      - NUKI_TOKEN=${NUKI_TOKEN:-}
      - VZUG_USER=${VZUG_USER:-}
      - VZUG_PASSWORD=${VZUG_PASSWORD:-}
      # Life360: Standorte für Telefone ohne HomePilot. Ohne diese
      # Zeilen kommt «Umgebungsvariable ... ist nicht gesetzt», obwohl
      # sie im Stack sichtbar ist - Portainer reicht nur durch, was hier
      # steht.
      - LIFE360_USER=${LIFE360_USER:-}
      - LIFE360_PASSWORD=${LIFE360_PASSWORD:-}
      - LIFE360_TOKEN=${LIFE360_TOKEN:-}
      # Fehlte hier – der lokale Tuya-Schlüssel gehört in beide Fassungen.
      - TUYA_KEY_PROJEKTOR=${TUYA_KEY_PROJEKTOR:-}
      - TZ=Europe/Zurich

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Live-Bild der Kameras: zieht RTSP von UniFi Protect und liefert es als
  # Low-Latency-HLS aus, ohne neu zu codieren. Der Hub legt die Kamerapfade
  # selbst über die Steuer-API an; läuft der Dienst nicht, fällt der Hub
  # automatisch auf ffmpeg zurück (gleiches Bild, mehr Rückstand).
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: homepilot-mediamtx
    restart: unless-stopped

    # Gleicher Deckel wie beim Hub - siehe dort.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Gleiches Netz wie der Hub: Er spricht den Dienst über 127.0.0.1 an,
    # und die Kameras sind direkt erreichbar.
    network_mode: host
    # Komplett über Umgebungsvariablen konfiguriert statt über eine
    # gemountete Datei: Bind-Mounts einzelner Dateien scheitern bei
    # Portainer-Repository-Stacks auf Snap-Docker an der Pfadauflösung.
    environment:
      # Steuer-API nur für den Hub auf demselben Rechner.
      - MTX_API=true
      - MTX_APIADDRESS=127.0.0.1:9997
      # Nur HLS anbieten – Kameras anzapfen geht auch ohne eigene Server.
      # Interner Publish-Port: ffmpeg (im Container) reicht das Video hier
      # ohne Tonspuren an mediamtx weiter – nur auf 127.0.0.1.
      - MTX_RTSP=true
      - MTX_RTSPADDRESS=127.0.0.1:8554
      - MTX_RTMP=false
      - MTX_SRT=false
      - MTX_WEBRTC=false
      - MTX_HLS=true
      - MTX_HLSADDRESS=127.0.0.1:8888
      # Low-Latency-HLS: 200-ms-Bruchstücke → unter einer Sekunde Rückstand.
      - MTX_HLSVARIANT=lowLatency
      - MTX_HLSSEGMENTCOUNT=7
      - MTX_HLSSEGMENTDURATION=1s
      - MTX_HLSPARTDURATION=200ms
      - MTX_HLSALLOWORIGIN=*
      # Nicht auf Vorrat umpacken: erst wenn jemand zuschaut.
      - MTX_HLSALWAYSREMUX=false

  # Matter-Controller. Hält die Fabric - Schlüssel, Zertifikate, die
  # Zugänge zu WLAN und Thread - und spricht mit den Geräten. Der Hub ist
  # nur ein WebSocket-Client darauf (ws://127.0.0.1:5580/ws).
  #
  # matter.js und nicht mehr der python-matter-server: Der ist seit dem
  # 23. Juni 2026 eingestellt, 8.1.2 war die letzte Fassung. Der
  # Nachfolger spricht dieselbe Schnittstelle und übernimmt beim ersten
  # Start ein vorhandenes Datenverzeichnis.
  #
  # host-Netz ist Pflicht: Matter findet Geräte über mDNS, und das geht
  # nicht durch ein Docker-Bridge-Netz. Ebenso Pflicht ist **IPv6 auf dem
  # Host** - der Dienst bindet mDNS an [::]:5353 und startet ohne IPv6
  # gar nicht erst («Cannot bind to {::}:5353»).
  #
  # Das Datenverzeichnis liegt bewusst als Ordner neben der config.yaml
  # und nicht in einem Docker-Volume: Dort steht die Fabric, und ohne sie
  # muss jedes Gerät neu gekoppelt werden. Als Ordner wandert sie mit
  # /opt/homepilot ins Backup, ein Volume übersieht man.
  #
  # Einmalig auf dem Host, sonst darf der Dienst nicht hineinschreiben:
  #   sudo mkdir -p /opt/homepilot/matter
  #   sudo chown -R 1000:1000 /opt/homepilot/matter
  matter:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: homepilot-matter
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Europe/Zurich
      # Nur auf dem Rechner selbst erreichbar. Von Haus aus horcht der
      # Dienst auf 0.0.0.0:5580 - ohne Anmeldung, und wer ihn erreicht,
      # kann jedes gekoppelte Gerät schalten. Bei einem Türschloss ist
      # das kein Schönheitsfehler. Der Hub läuft im selben host-Netz und
      # erreicht ihn über 127.0.0.1.
      - LISTEN_ADDRESS=127.0.0.1
    volumes:
      - /opt/homepilot/matter:/data
    # Kein Bluetooth. Das ist eine Entscheidung, keine Auslassung:
    # docker01 ist eine VM und hat keinen Adapter. Fordert der Dienst
    # trotzdem BLE an (NOBLE_BINDINGS=dbus samt /run/dbus), findet er
    # keinen bluez-Dienst, bricht die dbus-Verbindung weg und der ganze
    # Container stirbt mit «Error: write EPIPE» - nicht etwa nur die
    # Bluetooth-Funktion.
    #
    # Gebraucht wird BLE nur für Geräte, die fabrikneu aus der Packung
    # kommen. Was schon in Apple oder Google Home hängt, koppelt man über
    # einen dort erzeugten Code, und der läuft übers Netz.
    #
    # Auf einem Rechner MIT Adapter (prüfen: ls /sys/class/bluetooth)
    # kommen diese drei Zeilen dazu:
    #   environment:
    #     - NOBLE_BINDINGS=dbus
    #     - BLUETOOTH_ADAPTER=0
    #   volumes:
    #     - /run/dbus:/run/dbus:ro
