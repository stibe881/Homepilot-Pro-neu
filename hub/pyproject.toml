[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homepilot"
version = "0.2.0"
description = "Eigenes Home-Automation-Hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.9",
    "aiomqtt>=2.0",
    "qrcode>=7.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Schwere Protokollbibliotheken nur bei Bedarf:
roborock = ["python-roborock>=3.0"]
cast = ["pychromecast>=14.0"]
androidtv = ["androidtvremote2>=0.3"]
ring = ["ring-doorbell>=0.9"]
# Tuya-Geräte lokal im eigenen Netz (Lampen, Steckdosen, Projektoren).
tuya = ["tinytuya>=1.17"]
# Auf die 1.x-Serie festgelegt: pyoverkiz 2.x hat eine andere Client-API
# und verlangt Python 3.12. 1.20.6 läuft ab 3.10 und ist die getestete Basis.
overkiz = ["pyoverkiz>=1.13,<2.0"]
# Pit-Boss-Pelletgrill. Verlangt Python 3.12 – das Abbild bringt es mit,
# eine lokale Entwicklungsumgebung auf 3.11 nicht. Deshalb hier und nicht
# in den Grundabhängigkeiten.
pitboss = ["pytboss>=2026.8"]
# Durchsagen: Text zu Sprache über gTTS (braucht Internet zur Laufzeit).
speech = ["gTTS>=2.5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # CCU-Simulator für die Homematic-Tests; fehlt er, werden sie übersprungen.
    "pydevccu>=0.1.8",
    # Linter, Typprüfung und Abdeckung - siehe [tool.ruff] und [tool.mypy].
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
include = ["homepilot*"]

[tool.setuptools.package-data]
# Die «Was ist neu»-Liste, die das Bau-Skript vor dem Abbild-Bau erzeugt.
homepilot = ["changes.txt"]

# ── Linter ─────────────────────────────────────────────────────────────
# Ruff statt flake8+isort+pyupgrade: ein Werkzeug, eine Konfiguration, und
# schnell genug, um vor jedem Commit zu laufen.
[tool.ruff]
line-length = 92
target-version = "py311"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
# Bewusst knapp gehalten: Was hier steht, soll man beheben und nicht
# abschalten. E501 (Zeilenlänge) fehlt mit Absicht - die Kommentare in
# diesem Projekt sind Fliesstext und dürfen atmen.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Was hier steht, ist eine Entscheidung und kein Nachgeben:
#   E501    Zeilenlänge - die Kommentare sind Fliesstext und dürfen atmen.
#   B008    FastAPI lebt von Aufrufen in der Vorgabe (Depends, Query).
#   E402    Import nach Code - an ein paar Stellen bewusst spät, damit
#           schwere Bibliotheken nur bei Bedarf geladen werden.
#   SIM105  contextlib.suppress statt try/except/pass - hier steht meist
#           ein Kommentar im except, warum geschluckt wird. Der wäre weg.
#   SIM102/103/108/117  Zusammenziehen von if und with. Getrennt ist es
#           hier lesbarer, weil jeder Zweig seine eigene Begründung trägt.
ignore = [
    "E501", "B008", "E402",
    "SIM105", "SIM102", "SIM103", "SIM108", "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen sich wiederholen; das ist dort Absicht und keine Schuld.
"tests/*" = ["B011", "SIM117"]

# ── Typprüfung ─────────────────────────────────────────────────────────
# Absichtlich nachsichtig eingestellt: Bei zwanzigtausend Zeilen mit
# Any-lastigen Zustandswörterbüchern wäre strict eine Mauer. So findet
# mypy heute schon die echten Fehler, und man kann Modul für Modul
# nachziehen.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
exclude = "(build|dist|tests)/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
