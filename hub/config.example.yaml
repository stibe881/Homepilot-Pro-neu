# HomePilot-Pro-Konfiguration – nach config.yaml kopieren und anpassen.
# ${VARIABLE} wird aus Umgebungsvariablen gelesen, damit Keys nicht in der
# Datei landen.

api:
  host: 0.0.0.0
  port: 8123
  # Einzeltoken aus früheren Fassungen; gilt weiterhin und zählt als
  # Besitzer. Besser sind die Benutzer weiter unten.
  token: "${HOMEPILOT_TOKEN}"
  # Herkünfte, die der Browser ansprechen darf. Nötig für die Web-Fassung
  # der App, die unter einer anderen Adresse läuft als der Hub.
  cors_origins: ["*"]

# Wohin in der App angelegte Benutzer und Abläufe geschrieben werden.
# Standard: homepilot-data.json neben dieser Datei. Die Datei enthält Tokens
# und wird deshalb nur für den eigenen Benutzer lesbar angelegt.
# data_file: /etc/homepilot/homepilot-data.json

# Datenbank (siehe supabase/README.md). Weglassen = Hub läuft ohne Persistenz.
supabase:
  url: "https://dein-projekt.supabase.co"
  service_key: "${SUPABASE_SERVICE_KEY}"
  # Für die Anmeldung mit E-Mail und Passwort (Supabase Auth). Der
  # anon-Key ist öffentlich gedacht und darf hier stehen – er allein
  # erlaubt nichts ausser dem Anmeldeversuch. Ohne ihn bleibt es beim
  # Token/QR-Code. Einladungen verschickt der service_key von oben;
  # eine Selbstregistrierung gibt es bewusst nicht. Siehe
  # docs/anmeldung.md.
  anon_key: "${SUPABASE_ANON_KEY}"
  history: true
  flush_interval: 5
  # Off-Site-Kopie der täglichen Sicherung in diesen Storage-Bucket
  # (einmal im Supabase-Dashboard anlegen, privat). Leer = keine Kopie.
  # backup_bucket: backups
  history_exclude: []          # z.B. ["demo.*"] – kein Verlauf für diese Entitäten

# Gäste-WLAN: Die Benutzerverwaltung zeigt daraus einen QR-Code, den
# Besuch mit der Telefon-Kamera scannt - Tür und WLAN aus einer Karte.
# Klassisch (WPA-Passwort):
# guest_wifi:
#   ssid: "Familie Gross Gast"
#   password: "${GAST_WLAN_PASSWORT}"
# Mit Captive Portal (z.B. UniFi-Hotspot): Das Netz ist offen, der QR
# verbindet nur - das Portal-Passwort steht als Text unter dem Code.
# guest_wifi:
#   ssid: "Familie Gross Gast"
#   auth: open
#   portal_password: "${GAST_PORTAL_PASSWORT}"   # weglassen bei blossem Bestätigen

# Standort für Sonnenauf-/-untergangs-Trigger (Storen, adaptives Licht).
# Ohne diesen Abschnitt wird Zell LU angenommen.
location:
  latitude: 47.1445
  longitude: 8.0675

integrations:
  # Virtuelle Geräte zum Entwickeln und Testen – später entfernen.
  - integration: demo

  # Helfer-Schalter: virtuelle An/Aus-Zustände für Modi (input_boolean).
  # - integration: helpers
  #   switches:
  #     - id: abwesend
  #       name: Abwesend
  #       icon: airplane-outline
  #     - id: gaeste
  #       name: Gästemodus

  # Gerätegruppen: mehrere Geräte als eine Kachel schalten.
  # - integration: group
  #   groups:
  #     - id: lichter_eg
  #       name: Lichter EG
  #       members: [hue.stehlampe, hue.decke_kueche]
  #       kind: light        # light (Standard) oder switch

  # Adaptive Beleuchtung: Farbtemperatur folgt dem Sonnenstand.
  # - integration: adaptive
  #   lights: [hue.buero, hue.wohnzimmer]
  #   interval: 300
  #   warm: 400              # Mirek nachts/am Horizont (~2500 K)
  #   cool: 220              # Mirek zur Mittagssonne (~4500 K)

  # Anwesenheitssimulation: schaltet abends zufällig Lichter, wenn der
  # Auslöse-Schalter aktiv ist – das Haus wirkt bewohnt.
  # - integration: presence_sim
  #   switch: helpers.abwesend
  #   switch_active: "on"     # bei unifi.anyone_home stattdessen "off"
  #   lights: [hue.wohnzimmer, hue.buero]
  #   min_interval: 600
  #   max_interval: 1800
  #   only_after_dark: true

  # Unwetterwarnungen von MeteoAlarm (offizieller CAP/Atom-Feed).
  # Gefiltert wird über das Warnpolygon: Es erscheinen nur Warnungen, deren
  # Gebiet den Standort aus 'location' enthält. Kein 'areas' mehr nötig -
  # Namensfilter wie "Luzern" trafen auch die falsche Region
  # («Luzern-Alpnach» liegt am Vierwaldstättersee, nicht in Zell).
  - integration: meteoalarm
    countries: [switzerland]
    scan_interval: 900

  # Wetterlage und 7-Tage-Vorhersage (Open-Meteo, kostenlos, kein Schlüssel).
  # Koordinaten des eigenen Orts eintragen (hier: Zell LU).
  - integration: weather
    latitude: 47.1445
    longitude: 8.0675
    name: Zell LU

  # Philips Hue Bridge (lokale CLIP-v2-API).
  # App-Key erzeugen: Link-Taste der Bridge drücken, dann innert 30s:
  #   curl -sk -X POST https://<bridge-ip>/api -d '{"devicetype":"homepilot#hub"}'
  # - integration: hue
  #   host: 192.168.1.20
  #   app_key: "${HUE_APP_KEY}"

  # Sonoff & Co. über MQTT. Voraussetzung: Tasmota-Firmware auf dem Gerät.
  # - integration: mqtt
  #   broker: 192.168.1.5
  #   port: 1883
  #   username: "${MQTT_USER}"
  #   password: "${MQTT_PASSWORD}"
  #   devices:
  #     - topic: sonoff_kueche
  #       name: Steckdose Küche
  #     - topic: sonoff_bad
  #       name: Licht Bad
  #       kind: light

  # Homematic über die XML-RPC-Schnittstelle der CCU.
  # 'port' ist die Standard-Schnittstelle: 2001 = Funk (BidCos-RF),
  # 2010 = Homematic IP, 2000 = Wired. Einzelne Geräte dürfen einen eigenen
  # 'port' angeben – so laufen klassische und IP-Geräte gemischt.
  # Beim Start listet der Hub alle Kanäle je Schnittstelle ins Log – daraus
  # die gewünschten Adressen heraussuchen.
  # - integration: homematic
  #   host: 192.168.1.15
  #   port: 2001
  #   callback_port: 9125      # 0 = keine Events, nur Polling
  #   devices:
  #     - address: "ABC1234567:1"
  #       name: Licht Küche
  #       kind: switch
  #     - address: "ABC1234567:2"
  #       name: Stehlampe
  #       kind: light
  #       dimmable: true
  #     - address: "ABC7654321:4"
  #       name: Temperatur Bad
  #       kind: sensor
  #       datapoint: ACTUAL_TEMPERATURE
  #     # Fensterkontakt. 'device_class' sagt dem Hub, wofür der Melder
  #     # steht – daran hängen die Warnungen: contact (Fenster/Tür),
  #     # motion, smoke, moisture (Wassermelder). Bei den eindeutigen
  #     # Datenpunkten (STATE, MOTION, WATER_DETECTED …) errät der Hub es
  #     # selbst; angeben sticht raten.
  #     - address: "ABC1122334:1"
  #       name: Fenster Küche
  #       kind: binary_sensor
  #       datapoint: STATE
  #       device_class: contact
  #     # Wassermelder: meldet sofort und unabhängig davon, ob die
  #     # Alarmanlage scharf ist.
  #     - address: "ABC5566778:1"
  #       name: Wassermelder Keller
  #       kind: binary_sensor
  #       datapoint: WATER_DETECTED
  #       device_class: moisture
  #     # Homematic IP Schalt-Messsteckdose (HmIP-PSM), z.B. am Tumbler.
  #     # Bei HmIP liegt STATE auf dem Schaltkanal (meist Kanal 3); der
  #     # Messkanal (meist Kanal 6) liefert nur die Leistung.
  #     # Die Watt landen als 'power' im Zustand – daraus erkennt die
  #     # Startseite, ob der Tumbler gerade läuft.
  #     - address: "001015699EA263:3"     # Schaltkanal (SWITCH_VIRTUAL_RECEIVER)
  #       port: 2010
  #       name: Tumbler
  #       kind: switch
  #       power_address: "001015699EA263:6" # Messkanal (POWER in Watt)

  # Beschattung: Storen zu, wenn die Sonne wirklich aufs Fenster brennt.
  # Alle drei Bedingungen müssen zusammen zutreffen – jede einzeln führt in
  # die Irre: Die Richtung allein verdunkelt im Winter, die Höhe allein
  # beschattet mittags die Ostseite, die Temperatur allein reagiert auf
  # einen kalten klaren Tag gar nicht.
  # Wer eine Store von Hand öffnet, hat Vorrang: Die Automatik hält sich
  # dann bis zum nächsten Tag zurück.
  # - integration: shading
  #   temperature: hm.temp_aussen     # Entität mit der Aussentemperatur
  #   windows:
  #     - cover: overkiz.wohnzimmer
  #       azimuth: [90, 200]          # von Ost bis Süd-Süd-West
  #       elevation: 15               # erst ab dieser Sonnenhöhe (Grad)
  #       temperature: 22             # erst ab dieser Aussentemperatur
  #       position: 30                # wie weit zu (0 = ganz zu, 100 = offen)
  #   # Sturmschutz: Meldet die Wetterwarnung Wind oder Sturm, fahren alle
  #   # Storen hoch und bleiben oben, bis die Warnung vorbei ist - das
  #   # sticht jede andere Regel, auch die Handsperre. Ein beschädigter
  #   # Behang kostet mehr als jede aufgeheizte Stube.
  #   storm: meteoalarm.warnungen     # Entität der Wetterwarnung

  # Geofence: Ankommen und Weggehen, gemeldet vom Telefon selbst (iOS-
  # Kurzbefehle oder Tasker → POST /api/presence/geofence). Merkt den
  # Aufbruch Minuten früher als das WLAN – siehe docs/geofence.md.
  # - integration: geofence
  #   zones:
  #     - id: stefan
  #       name: Stefan
  #     - id: livia
  #       name: Livia

  # UniFi: Anwesenheitserkennung anhand verbundener Geräte.
  # Liefert zusätzlich unifi.anyone_home und unifi.clients_total.
  # - integration: unifi
  #   host: 192.168.1.1
  #   username: "${UNIFI_USER}"
  #   password: "${UNIFI_PASSWORD}"
  #   site: default
  #   scan_interval: 30
  #   track:
  #     - mac: "aa:bb:cc:dd:ee:ff"
  #       name: iPhone Stefan

  # Twinkly-Lichterkette (lokale REST-API).
  # - integration: twinkly
  #   host: 192.168.1.30
  #   name: Weihnachtsbaum
  #   default_mode: movie

  # UniFi Protect: Kameras mit Bewegungs- und Klingel-Ereignissen (lesend).
  # Nutzt denselben Controller-Login wie 'unifi'.
  # UniFi Protect: Kameras (eigener Menüpunkt «Kameras» in der App).
  # 'host' ist die UniFi-Konsole, nicht eine Kamera. Für den Hub einen
  # eigenen Local-Access-Benutzer mit «View Only» auf Protect anlegen und
  # ohne Zwei-Faktor lassen. Anleitung: docs/kameras.md
  # Live-Bild: in Protect je Kamera RTSP einschalten (Kamera → Einstellungen
  # → Erweitert → RTSP). 'stream_quality' wählt den Kanal: low für ein
  # Wandpanel im WLAN, high fürs grosse Bild.
  # - integration: unifi_protect
  #   host: 192.168.1.1
  #   username: "${UNIFI_USER}"
  #   password: "${UNIFI_PASSWORD}"
  #   scan_interval: 120
  #   stream_quality: medium     # high | medium | low

  # Hue Play HDMI Sync Box. Token: Knopf an der Box ~3s halten, dann
  #   curl -sk -X POST https://<box-ip>/api/v1/registrations \
  #        -d '{"appName":"homepilot","instanceName":"hub"}'
  # - integration: hue_sync
  #   host: 192.168.1.25
  #   access_token: "${HUE_SYNC_TOKEN}"

  # Spotify: Playlisten auf jede sichtbare Box starten (auch aus Stille),
  # was gerade läuft, Play/Pause/Weiter, Lautstärke, Wiedergabe umziehen.
  # Einrichtung (einmalig, ~5 Minuten): siehe Kopf von
  # hub/homepilot/integrations/spotify.py – der refresh_token braucht auch
  # die playlist-read-Scopes, sonst bleibt die Playlist-Liste leer.
  # Anmelden (einmalig): docker exec -it homepilot-hub \
  #     python -m homepilot.integrations.spotify -c /config/config.yaml
  # Der Helfer legt den refresh_token in spotify-token.json ab –
  # eine SPOTIFY_REFRESH_TOKEN-Variable braucht es dann nicht mehr.
  # - integration: spotify
  #   client_id: "${SPOTIFY_CLIENT_ID}"
  #   client_secret: "${SPOTIFY_CLIENT_SECRET}"

  # Roborock-Staubsauger. Braucht: pip install python-roborock
  # position_interval: Wie oft die Position während der Reinigung geholt
  # wird (Sekunden) – der Punkt auf der Karte wandert dann live mit.
  # - integration: roborock
  #   username: "${ROBOROCK_EMAIL}"
  #   password: "${ROBOROCK_PASSWORD}"
  #   position_interval: 15

  # Google Cast (Chromecast, Cast-Lautsprecher). Braucht: pip install pychromecast
  # Feste IPs statt mDNS-Suche – dem Gerät im Router eine feste Adresse geben.
  # - integration: google_cast
  #   devices:
  #     - host: 192.168.1.35
  #       name: Wohnzimmer TV

  # Google Calendar: die nächsten Termine als Kachel, Geburtstage fürs
  # Familienmodul. Einmalige Anmeldung:
  #   python -m homepilot.integrations.google_calendar -c config.yaml
  # - integration: google_calendar
  #   client_id: "${GOOGLE_CLIENT_ID}"
  #   client_secret: "${GOOGLE_CLIENT_SECRET}"
  #   calendar_ids:
  #     - primary
  #     - addressbook#contacts@group.v.calendar.google.com   # Geburtstage

  # Android TV / Google TV (auch Nvidia Shield). Braucht:
  #   pip install androidtvremote2
  # Einmalige PIN-Kopplung am Fernseher:
  #   python -m homepilot.integrations.androidtv -c config.yaml
  #
  # «apps» bestimmt, was die Kachel zum Starten anbietet. Ohne Eintrag
  # eine kurze Vorgabe (Plex, Zattoo, YouTube, Netflix, Disney+, Prime).
  # Das Protokoll kann Apps starten, aber nicht aufzählen - deshalb steht
  # die Liste hier und kommt nicht vom Fernseher. Den Paketnamen zeigt
  # der Play-Store in der Adresszeile («?id=…»).
  # - integration: androidtv
  #   # Gilt für alle Geräte darunter …
  #   apps:
  #     - com.plexapp.android
  #     - com.zattoo.player
  #     - { name: Mediathek, app: tv.arte.plus7 }
  #   devices:
  #     - host: 192.168.1.50
  #       name: Fernseher Wohnzimmer
  #     - host: 192.168.1.51
  #       name: Fernseher Schlafzimmer
  #       # … und lässt sich je Gerät ganz ersetzen.
  #       apps:
  #         - com.plexapp.android

  # Overkiz (Somfy TaHoma & Co.): Storen, Rollläden, Markisen.
  # Braucht: pip install pyoverkiz. Entwicklermodus im Somfy-Konto
  # aktivieren, dann ein lokales Token in der TaHoma-App erzeugen
  # ("Token verwalten") und hier eintragen. Alternativ der Helfer:
  #   python -m homepilot.integrations.overkiz -c config.yaml
  # - integration: overkiz
  #   host: gateway-2310-9733-0267.local:8443
  #   token: "${OVERKIZ_TOKEN}"

  # Nuki Smart Lock (Wohnungstüre): auf-/abschliessen und aufziehen.
  # Token: In der Nuki-App «Nuki Web» aktivieren, dann auf web.nuki.io
  # unter «API» ein Token erzeugen (Anzeigen + Bedienen erlauben).
  # - integration: nuki
  #   token: "${NUKI_TOKEN}"
  #   scan_interval: 60

  # Ring-Türklingeln und -Kameras. Braucht: pip install ring-doorbell
  # Einmalige Anmeldung mit 2FA-Code:
  #   python -m homepilot.integrations.ring -c config.yaml
  # - integration: ring
  #   scan_interval: 300

  # Pit-Boss-Pelletgrill (auch Louisiana Grills). Braucht: pip install pytboss
  # Ausführlich in docs/grill.md.
  # Mehrere Lampen als eine Leuchte. Eine Deckenlampe mit fünf Spots
  # soll ein Licht sein, nicht fünf - die Mitglieder verschwinden dann
  # aus Räumen, Suche und Zählung. Anlegen geht auch in der App unter
  # Geräte; die Zeile hier genügt dafür.
  # - integration: group
  #   groups:
  #     - id: decke_wohnzimmer
  #       name: Deckenlampe Wohnzimmer
  #       members: [hue.spot_1, hue.spot_2, hue.spot_3]
  #       # Sollen die Einzelnen aus Räumen, Suche und Zählung
  #       # verschwinden? Standard ja - das ist der Sinn bei einer
  #       # Deckenlampe. Bei zwei Stehlampen, die man meist gemeinsam
  #       # und manchmal einzeln schaltet, lieber false.
  #       hide_members: true

  # - integration: pitboss
  #   name: Grill
  #   model: PBV4PS2            # steht auf dem Typenschild
  #   host: 10.10.1.60          # lokal – ohne Umweg über die Hersteller-Cloud
  #   # grill_id: "..."         # Alternative: über die Cloud, Kennung aus der App
  #   scan_interval: 30
  #   # Anzünden aus der Ferne ist absichtlich aus – es entfacht ein Feuer
  #   # in einem Gerät, neben dem niemand stehen muss.
  #   allow_remote_start: false

  # Matter über matterjs-server (läuft als eigener Dienst, siehe
  # docker-compose.yml - er braucht host-Netz und IPv6). Geräte koppeln:
  #   python -m homepilot.integrations.matter -c config.yaml --pair 34970112332
  # Tür-/Fensterkontakte (z.B. Aqara P2) melden offen/geschlossen und ihren
  # Batteriestand; offene Türen erscheinen auf der Startseite.
  # Anleitung inkl. Teilen aus Apple/Google Home: docs/tuer-und-fensterkontakte.md
  # - integration: matter
  #   url: ws://127.0.0.1:5580/ws
  #   # Nur nötig, wenn ein Türschloss für Befehle aus der Ferne einen
  #   # Code verlangt (Nuki-App → Einstellungen → Matter).
  #   # pin: "123456"

  # V-ZUG-Geräte (lokale Home-API, nur lesend). Die Geräte müssen über
  # V-ZUG-Home im WLAN sein; im Router feste IPs vergeben. Die Namen
  # «Geschirrspüler» und «Waschmaschine» sorgen dafür, dass die Startseite
  # sie den richtigen Kacheln zuordnet.
  # - integration: vzug
  #   scan_interval: 60
  #   devices:
  #     - host: 192.168.1.40
  #       name: Geschirrspüler      # AdoraDish V2000
  #     - host: 192.168.1.41
  #       name: Waschmaschine       # AdoraWash V4000

# Benutzer und Rollen. Jeder bekommt ein eigenes Token – dann steht in
# jedem Protokolleintrag, wer geschaltet hat, und ein Zugang lässt sich
# einzeln zurückziehen.
#
#   besitzer  darf alles, auch Benutzer verwalten und Automationen ändern
#   bewohner  bedient das ganze Haus, darf Automationen pausieren
#   gast      sieht und schaltet nur Freigegebenes (ohne 'allow': Licht und
#             Schalter), erfährt nichts über Anwesenheit, Verlauf oder System
#
# Token erzeugen: openssl rand -base64 32
users:
  - name: Stefan
    role: besitzer
    token: "${TOKEN_STEFAN}"
  # - name: Partnerin
  #   role: bewohner
  #   token: "${TOKEN_PARTNERIN}"
  # - name: Ferienwohnung
  #   role: gast
  #   token: "${TOKEN_GAST}"
  #   allow: ["hue.*", "mqtt.sonoff_gaestezimmer"]
  # Kinder-Ansicht: Die App zeigt dieser Person nur die genannten Räume,
  # als grosse Knöpfe - ohne Einstellungen, Alarm und den Rest. Lässt
  # sich auch in der App unter Benutzerverwaltung antippen.
  # - name: Levin
  #   role: bewohner
  #   token: "${TOKEN_LEVIN}"
  #   simple_rooms: ["Levin"]

# Szenen: eine benannte Liste von Kommandos, mit einem Tippen auslösbar.
scenes:
  - id: alles_aus
    name: Alles aus
    icon: moon-outline
    actions:
      - { entity_id: demo.light_livingroom, command: turn_off }
      - { entity_id: demo.light_bedroom, command: turn_off }
      - { entity_id: demo.switch_coffee, command: turn_off }
  - id: guten_morgen
    name: Guten Morgen
    icon: sunny-outline
    actions:
      - { entity_id: demo.light_livingroom, command: turn_on, data: { brightness: 60 } }
      - { entity_id: demo.switch_coffee, command: turn_on }

# Strompreis für die Kostenanzeige (Einstellungen → Energie).
# Achtung auf die Einheit: Franken je kWh, nicht Rappen. Auf der
# Stromrechnung stehen meist Rappen – 25.41 Rp./kWh sind also 0.2541.
energy:
  price_per_kwh: 0.2541
  currency: CHF

# Push-Nachrichten mit Bild.
#
# Löst der Alarm aus, kann die Meldung das Kamerabild des betroffenen Raums
# gleich mitbringen. Dafür braucht es diese Adresse: Das Telefon zeigt die
# Nachricht an, lange bevor die App läuft – es holt das Bild also selbst und
# ohne Anmeldung. Der Hub legt es deshalb unter einer zufälligen Adresse ab,
# die zehn Minuten gilt und nur dieses eine Bild hergibt; danach ist sie tot
# (siehe hub/homepilot/core/snapshots.py).
#
# Nur eintragen, wenn der Hub von aussen erreichbar ist – und dann über
# HTTPS. Ohne diesen Eintrag geht die Nachricht ohne Bild raus; die Kamera
# lässt sich in der App trotzdem mit einem Tippen auf die Meldung öffnen.
#
# Auf Android erscheint das Bild ohne weiteres Zutun. Auf iOS braucht es
# einen eigenen App-Build mit der Erweiterung aus app/targets/ – die zwei
# Angaben dafür stehen in docs/eigener-app-build.md.
# push:
#   public_url: https://haus.example.ch

# Update aus der App (System → «Update anstossen»).
#
# Der Hub kann sich nicht selbst neu bauen – er läuft in einem Container
# und hat weder das Repository noch Docker zur Hand. Das wäre auch kein
# Zugriff, den ein Hausautomations-Dienst haben sollte.
#
# Was er kann: diese Adresse aufrufen. Sinnvoll ist der Stack-Webhook von
# Portainer (Stacks → homepilot → Webhook) oder ein eigener kleiner Dienst
# auf dem Host, der rebuild-hub.sh startet. Ohne Eintrag bleibt der Knopf
# ohne Wirkung und sagt das auch.
# Zwei Möglichkeiten:
#
#   a) Der Update-Listener auf dem Host (deploy/update-listener.py). Der
#      baut das Abbild neu *und* rollt aus – ein Tipp genügt. Braucht ein
#      Geheimnis, weil er auf dem Host baut. Einrichtung: deploy/portainer.md
# update:
#   webhook_url: http://172.17.0.1:9126/update
#   token: "${UPDATE_SECRET}"
#
#   b) Nur der Portainer-Webhook. Der rollt den Stack mit dem *vorhandenen*
#      Abbild neu aus – er baut nicht. Also nur ein Neustart, kein Update.
# update:
#   webhook_url: https://portainer.example.com/api/stacks/webhooks/xxxxxxxx

# Web-Fassung der App vom Hub ausliefern lassen.
#
# Damit erreicht man die App über dieselbe Adresse wie die Schnittstelle –
# praktisch, wenn man ohne VPN von unterwegs zugreifen will. Der Preis:
# Die ganze Steuerung hängt dann am offenen Internet, geschützt allein
# durch das Token. Was das heisst und wie man es absichert, steht in
# docs/app-ohne-vpn.md.
#
# Gebaut wird sie mit «npm run build:web» im Ordner app/, der Inhalt von
# app/dist/ kommt dann hierher.
# web_root: /config/web

# Räume: Die App macht daraus ihre Reiter. Ohne diesen Abschnitt zeigt sie
# einfach alle Geräte ohne Reiter an.
rooms:
  Wohnzimmer:
    - demo.light_livingroom
    - demo.temp_livingroom
  Küche:
    - demo.switch_coffee
  Schlafzimmer:
    - demo.light_bedroom
  Flur:
    - demo.motion_hall

automations:
  - id: motion_light
    alias: Licht bei Bewegung
    trigger:
      - type: state
        entity_id: demo.motion_hall
        to: "on"
    condition:
      - type: state
        entity_id: demo.light_livingroom
        equals: "off"
    action:
      - type: command
        entity_id: demo.light_livingroom
        command: turn_on
        data: { brightness: 80 }

  # Bewegungslicht: an bei Bewegung, nach einer Weile wieder aus.
  # 'mode' entscheidet, was eine erneute Bewegung während der Wartezeit
  # tut - beide Antworten sind richtig, nur in verschiedenen Räumen:
  #   single (Vorgabe) = der laufende Ablauf zählt, das Licht geht 5 Min
  #                      nach der *ersten* Bewegung aus. Für Durchgänge.
  #   restart          = die Wartezeit beginnt von vorn, das Licht bleibt
  #                      an, solange sich etwas rührt. Für Flur und Bad.
  # Lässt man Warten und Ausschalten weg, bleibt das Licht an, bis es
  # jemand von Hand oder ein anderer Ablauf ausschaltet.
