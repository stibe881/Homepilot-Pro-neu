# Der MQTT-Broker des Hauses.
#
# Diese Datei muss **existieren**, bevor der Stack startet, und sie muss
# eine Datei sein. Fehlt sie, legt Docker an ihrer Stelle wortlos einen
# *Ordner* an und der Container stirbt beim Start mit einer Meldung, die
# nicht sagt, was fehlt:
#
#   error mounting ".../deploy/mosquitto.conf" to rootfs at
#   "/mosquitto/config/mosquitto.conf": ... not a directory
#
# «not a directory» heisst hier: Docker hat einen Ordner gefunden, wo der
# Container eine Datei erwartet. Wer das einmal hatte, muss den Ordner
# von Hand wegräumen - ein späterer Klon legt die Datei nicht über einen
# bestehenden Ordner.

# ── Wer hereindarf ────────────────────────────────────────────────────
#
# Ein Broker im Hausnetz, ohne Passwort. Das ist eine Entscheidung, keine
# Auslassung: Zigbee2MQTT und der Hub laufen auf demselben Rechner, und
# ein Passwort, das in zwei Konfigurationen und einer Portainer-Variable
# steht, wird beim ersten Umzug vergessen - dann schweigt das halbe Haus,
# und die Ursache steht in einem Containerprotokoll, das niemand liest.
#
# Der Broker hört deshalb **nicht** auf allen Wegen ins Haus: Er steht
# hinter der Firewall des Docker-Hosts, und Port 1883 gehört dort nicht
# nach aussen freigegeben.
#
# Passwörter nachrüsten, ohne diese Datei anzufassen - eine eigene Datei
# in conf.d legen (siehe unten):
#
#   docker exec -it homepilot-mosquitto \
#     mosquitto_passwd -c /mosquitto/config/passwd homepilot
#   printf 'allow_anonymous false\npassword_file /mosquitto/config/passwd\n' \
#     | sudo tee /opt/homepilot/mosquitto/conf.d/auth.conf
#
# Danach dieselben Zugangsdaten in die config.yaml des Hubs
# (docs/zigbee.md) und in Zigbee2MQTT eintragen.
listener 1883
allow_anonymous true

# ── Was der Broker behält ─────────────────────────────────────────────
#
# Zigbee2MQTT legt seine Gerätebeschreibungen als «retained» ab: Der Hub
# liest beim Verbinden, was es im Haus gibt, ohne auf die nächste
# Meldung jedes Fensterkontakts zu warten. Ohne Persistenz wäre das nach
# jedem Neustart des Brokers weg, und die Kacheln stünden blass da, bis
# sich jedes Gerät einmal von selbst gemeldet hat - bei einem selten
# benutzten Fenster dauert das Tage (siehe docs/zigbee.md).
persistence true
persistence_location /mosquitto/data/

# ── Das Protokoll ─────────────────────────────────────────────────────
#
# Auf die Konsole und nicht in eine eigene Datei: Dann greift der Deckel
# aus der docker-compose (max-size/max-file), und `docker logs
# homepilot-mosquitto` zeigt dasselbe wie Portainer. Eine Logdatei im
# Container wüchse daneben unbeachtet weiter.
log_dest stdout
log_type error
log_type warning
log_type notice

# ── Platz für Eigenes ─────────────────────────────────────────────────
#
# Alles, was zu diesem Haus gehört und nicht ins Repo - Passwörter,
# Brücken zu einem zweiten Broker, ein zweiter Listener - kommt als
# eigene .conf hierhin. So bleibt diese Datei die, die mit dem Repo
# mitkommt, und ein `git pull` überschreibt nichts Persönliches.
#
# Der Ordner muss existieren (er darf leer sein):
#   sudo mkdir -p /opt/homepilot/mosquitto/conf.d
include_dir /mosquitto/config/conf.d
