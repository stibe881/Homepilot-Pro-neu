# Der MQTT-Broker für Zigbee2MQTT - und nur dafür.
#
# Mosquitto 2.x horcht von Haus aus auf gar nichts, wenn keine
# `listener`-Zeile dasteht: Es startet, nimmt aber keine Verbindung an,
# und der Fehler lautet nur «Connection refused». Deshalb steht sie hier
# ausdrücklich.
#
# **Nur 127.0.0.1.** Alle drei Beteiligten - Broker, Zigbee2MQTT und der
# Hub - laufen im host-Netz desselben Rechners und erreichen einander
# über die Schleife. Ein Broker, der ins WLAN horcht, ist etwas ganz
# anderes: Wer ihn erreicht, hört jeden Fensterkontakt mit und darf
# jedes Licht schalten, denn MQTT kennt keine Rechte je Thema.
#
# Daraus folgt auch, warum hier kein Passwort steht: Es gäbe keinem
# etwas, der nicht ohnehin schon auf dem Rechner ist - und ein Passwort
# in einer Datei, das niemanden abhält, ist schlechter als keines: Es
# sieht nach Sicherheit aus.
#
# Sollen später Tasmota-Geräte aus dem WLAN dazukommen, ändert sich
# beides zusammen und nicht einzeln:
#   listener 1883 127.0.0.1
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
listener 1883 127.0.0.1
allow_anonymous true

# Was der Broker behält, wenn er neu startet. Zigbee2MQTT meldet seine
# Geräteliste beim Verbinden ohnehin neu; gespeichert wird trotzdem,
# damit ein Neustart mitten in der Nacht keine Meldung verschluckt, die
# gerade unterwegs ist.
persistence true
persistence_location /mosquitto/data/

# Ins Docker-Protokoll statt in eine eigene Datei - dort greift der
# Deckel aus der docker-compose.yml.
log_dest stdout
log_type warning
log_type error
log_type notice
