# Zigbee2MQTT für den SONOFF Dongle Max (Dongle-M) am Netzwerkkabel.
#
# Kopieren nach hub/zigbee2mqtt/configuration.yaml - **nicht** ins Repo
# zurück: Zigbee2MQTT schreibt beim ersten Start den Netzwerkschlüssel
# hinein, und der ist das Geheimnis, mit dem man das ganze Zigbee-Netz
# mithört. Der Ordner steht deshalb in der .gitignore.
#
# Im Portainer-Stack liegt der Ordner unter /opt/homepilot, von Hand
# unter hub/ im Klon - siehe die beiden Compose-Dateien:
#
#   sudo mkdir -p /opt/homepilot/zigbee2mqtt
#   sudo cp deploy/zigbee2mqtt.example.yaml \
#           /opt/homepilot/zigbee2mqtt/configuration.yaml
#   sudo chown -R 1000:1000 /opt/homepilot/zigbee2mqtt

mqtt:
  base_topic: zigbee2mqtt
  # Derselbe Rechner, deshalb die Schleife - siehe deploy/mosquitto.conf.
  server: mqtt://127.0.0.1:1883

serial:
  # **Hier die feste Adresse des Dongles eintragen.** `Dongle-M.local`
  # steht in der Anleitung von SONOFF und funktioniert über mDNS - aber
  # eben nur, solange mDNS funktioniert. Fällt es aus, sieht das aus wie
  # ein defekter Dongle: Zigbee2MQTT startet nicht, und kein Gerät
  # meldet sich mehr. Eine feste Adresse im Router kostet fünf Minuten
  # und nimmt diese Fehlerquelle weg.
  port: tcp://192.168.1.60:6638
  # Der Dongle Max trägt einen EFR32MG24 von Silicon Labs, und der
  # spricht EmberZNet. `zstack` wäre der Texas-Instruments-Stick, den
  # man sonst überall liest - damit verbindet sich hier nichts.
  adapter: ember
  baudrate: 115200
  rtscts: false

frontend:
  # Zum Anlernen und - wichtiger - zum Benennen. Der Hub leitet die
  # Kennung einer Kachel vom Namen in Zigbee2MQTT ab: Wer später
  # umbenennt, bekommt eine neue Kachel, und Raum, Favorit und Abläufe
  # zeigen auf die alte (docs/zigbee.md). Also: erst benennen, dann den
  # Hub lesen lassen.
  enabled: true
  port: 8099

# Aus, und zwar bewusst. Ein dauerhaft offenes Netz nimmt jedes Gerät
# in Reichweite auf, auch das des Nachbarn - und ein fremdes Gerät im
# eigenen Zigbee-Netz ist ein Weg hinein. Zum Anlernen macht man es in
# der Weboberfläche für ein paar Minuten auf.
permit_join: false

# Der Hub liest die Geräteliste selbst (integrations/zigbee2mqtt.py).
# Die Home-Assistant-Meldungen wären ein zweiter Satz Themen, den hier
# niemand liest.
homeassistant:
  enabled: false

# An, und das ist hier keine Geschmacksfrage.
#
# Der Hub abonniert `<name>/availability` und legt jedes Gerät zunächst
# als *nicht erreichbar* an - ein Zigbee-Sensor meldet sich ja erst,
# wenn sich etwas ändert. Bleibt dieser Abschnitt weg, steht er bei
# Zigbee2MQTT auf `false`, die Meldungen kommen nie, und in der App ist
# nach jedem Neustart des Hubs das ganze Zigbee-Netz blass. Bei einem
# Erschütterungssensor bis zum nächsten Mal, an dem jemand daran
# rüttelt.
#
# Batterien kostet das nichts: Aktiv angefragt werden nur Geräte am
# Strom. Batteriegeräte gelten nach `passive.timeout` Minuten ohne
# Lebenszeichen als weg - 25 Stunden, grosszügig genug für einen
# Fensterkontakt, der tagelang zubleibt.
availability:
  enabled: true

advanced:
  # Aus. Zigbee2MQTT sagt es in seinem eigenen Schema deutlich: «can
  # execute arbitrary user-provided code».
  #
  # Die Weboberfläche auf 8099 hat keine Anmeldung und hängt am
  # host-Netz - sie ist aus dem ganzen WLAN erreichbar. Mit dieser
  # Einstellung darf jeder, der sie öffnet, beliebigen Code im Container
  # ausführen. Nebenan ist der Broker mit Bedacht auf 127.0.0.1
  # eingesperrt; eine offene Tür daneben macht das zunichte.
  #
  # Gebraucht wird es hier nicht: Der Hub liest die Themen selbst, eigene
  # Konverter kommen nicht vor. Wer später ein exotisches Gerät anbindet,
  # das einen braucht, stellt es für die Dauer wieder an - bewusst und
  # nicht aus Versehen.
  enable_external_js: false
  # Beim ersten Start erzeugt und danach in dieser Datei festgehalten.
  # Wer ihn später ändert, muss jedes Gerät neu anlernen.
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  # Der Kanal. 11, 15, 20 und 25 liegen zwischen den WLAN-Kanälen 1, 6
  # und 11 - auf einem anderen wird Zigbee genau dann unzuverlässig,
  # wenn jemand Netflix schaut.
  channel: 25
  # `info` und nicht `warning`, obwohl es mehr Zeilen sind.
  #
  # Beim ersten Start sind die interessanten Meldungen allesamt `info`:
  # «Starting Zigbee2MQTT version …», «Connecting to MQTT server»,
  # «Adapter ready». Auf `warning` schweigt der Dienst stattdessen
  # vollständig - und ein Container, der oben ist und nichts sagt, sieht
  # genau aus wie einer, der hängt. Hier ist nach dem Ausrollen zehn
  # Minuten lang gesucht worden, wo gar nichts kaputt war.
  #
  # Die Menge kostet nichts: Das Protokoll geht ins Docker-Log, und dort
  # greift der Deckel aus der docker-compose.yml (10 MB × 3).
  log_level: info
